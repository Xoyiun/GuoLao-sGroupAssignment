name: TestDriver

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run TestDriver
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run TestDriver
        run: uv run python TestDriver.py --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results.xml
